<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A minimal, GitHub-style heatmap of personal learning activity.">
  <title>Learning Contributions</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --cell-border: rgba(31, 35, 40, .06);
      --tip-bg: #25292e;
      --tip-fg: #ffffff;
      --level-0: #ebedf0;
      --level-1: #9be9a8;
      --level-2: #40c463;
      --level-3: #30a14e;
      --level-4: #216e39;
      --today: #0969da;
      --label-w: 30px;
      --cell: 10px;
      --gap: 3px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-synthesis: none;
    }
    /* Dark palette: follows the system setting, or force it with ?theme=dark / ?theme=light. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --border: #30363d;
        --cell-border: rgba(255, 255, 255, .05);
        --tip-bg: #3d444d;
        --tip-fg: #f0f6fc;
        --level-0: #161b22;
        --level-1: #0e4429;
        --level-2: #006d32;
        --level-3: #26a641;
        --level-4: #39d353;
        --today: #58a6ff;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --border: #30363d;
      --cell-border: rgba(255, 255, 255, .05);
      --tip-bg: #3d444d;
      --tip-fg: #f0f6fc;
      --level-0: #161b22;
      --level-1: #0e4429;
      --level-2: #006d32;
      --level-3: #26a641;
      --level-4: #39d353;
      --today: #58a6ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; color: var(--fg); }
    body { font-size: 12px; line-height: 1.4; }
    .panel {
      width: 100%; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); padding: 14px 16px 12px;
    }
    .count { margin: 0 0 10px; font-size: 14px; font-weight: 400; }
    .viewport { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
    .viewport.scrolls { padding-bottom: 8px; }
    .calendar { display: grid; grid-template-columns: var(--label-w) max-content; width: max-content; }
    /* Weekday labels stay visible when a narrow embed scrolls horizontally. */
    .corner, .weekdays { position: sticky; left: 0; z-index: 1; background: var(--bg); }
    .months { position: relative; height: 18px; color: var(--muted); }
    .month { position: absolute; top: 0; left: calc(var(--col) * (var(--cell) + var(--gap))); white-space: nowrap; }
    .month.end { left: auto; right: 0; }
    .weekdays {
      display: grid; grid-template-rows: repeat(7, var(--cell)); row-gap: var(--gap);
      color: var(--muted); font-size: 11px; line-height: var(--cell);
    }
    .days {
      display: grid; grid-auto-flow: column;
      grid-template-rows: repeat(7, var(--cell)); grid-auto-columns: var(--cell); gap: var(--gap);
    }
    .day { border-radius: 2px; background: var(--level-0); outline: 1px solid var(--cell-border); outline-offset: -1px; }
    .l1 { background: var(--level-1); }
    .l2 { background: var(--level-2); }
    .l3 { background: var(--level-3); }
    .l4 { background: var(--level-4); }
    .day.today { outline-color: var(--today); }
    .outside { visibility: hidden; }
    .footer {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; flex-wrap: wrap; margin-top: 8px; color: var(--muted); font-size: 11px;
    }
    .legend { margin-left: auto; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
    .legend span:first-child { margin-right: 3px; }
    .legend span:last-child { margin-left: 3px; }
    .legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--level-0); outline: 1px solid var(--cell-border); outline-offset: -1px; }
    .legend i.l1 { background: var(--level-1); }
    .legend i.l2 { background: var(--level-2); }
    .legend i.l3 { background: var(--level-3); }
    .legend i.l4 { background: var(--level-4); }
    .tip {
      position: fixed; z-index: 10; pointer-events: none; padding: 5px 8px; border-radius: 6px;
      max-width: min(280px, calc(100vw - 8px)); background: var(--tip-bg); color: var(--tip-fg);
      font-size: 12px; line-height: 1.35;
    }
    .tip[hidden] { display: none; }
    .tip span { display: block; }
    .tip span + span { opacity: .75; }
    @media (max-width: 480px) {
      .panel { padding: 10px 10px 8px; }
    }
  </style>
</head>
<body>
  <main class="panel" aria-label="Learning contribution heatmap">
    <h2 class="count" id="count">Learning contributions</h2>
    <div class="viewport" id="viewport">
      <div class="calendar">
        <div class="corner"></div>
        <div class="months" id="months" aria-hidden="true"></div>
        <div class="weekdays" id="weekdays" aria-hidden="true">
          <span></span><span>Mon</span><span></span><span>Wed</span>
          <span></span><span>Fri</span><span></span>
        </div>
        <div class="days" id="days" role="list" aria-label="Daily learning levels"></div>
      </div>
    </div>
    <footer class="footer">
      <span id="status" role="status"></span>
      <span class="legend" aria-label="Learning level scale from 0 to 4">
        <span>Less</span><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>More</span>
      </span>
    </footer>
  </main>
  <div class="tip" id="tip" hidden><span></span><span></span></div>
  <script>
    'use strict';
    // Day boundaries follow Europe/London so a date means the same day on every device.
    // contributions.json is the source of truth; this page never stores anything locally.
    const DATA_FILE = './contributions.json';
    const TIME_ZONE = 'Europe/London';
    const DAY_MS = 86400000;
    const WEEKS = 53;
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const LEVELS = [
      'No recorded learning',
      'Light learning or review',
      'Completed one learning question',
      'Deep reasoning or conceptual understanding',
      'Practical implementation or knowledge integration'
    ];
    const root = document.documentElement;
    const el = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, '0');
    const iso = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
    const addDays = (d, n) => new Date(d.getTime() + n * DAY_MS);
    const longDate = d => `${WEEKDAYS[d.getUTCDay()]}, ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;

    const theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;

    let records = null; // last successfully loaded records

    // Today's calendar date in London, as a UTC midnight so date arithmetic ignores DST.
    function londonToday() {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(new Date());
      const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
      return new Date(Date.UTC(+p.year, +p.month - 1, +p.day));
    }

    function draw() {
      const today = londonToday(), first = addDays(today, -364);
      const gridStart = addDays(first, -first.getUTCDay());
      const data = records || {};
      const cells = [], months = [];
      let learningDays = 0, lastMonth = -1;
      for (let w = 0; w < WEEKS; w++) {
        // A column takes the month of its first in-range day.
        const top = w === 0 ? first : addDays(gridStart, w * 7);
        if (top.getUTCMonth() !== lastMonth) {
          months.push({col: w, name: MONTHS[top.getUTCMonth()]});
          lastMonth = top.getUTCMonth();
        }
        for (let dow = 0; dow < 7; dow++) {
          const d = addDays(gridStart, w * 7 + dow);
          if (d < first || d > today) { cells.push('<span class="day outside"></span>'); continue; }
          const key = iso(d), raw = data[key];
          const level = Number.isInteger(raw) && raw >= 1 && raw <= 4 ? raw : 0;
          if (level) learningDays++;
          const todayClass = d.getTime() === today.getTime() ? ' today' : '';
          cells.push(`<span class="day l${level}${todayClass}" role="listitem" data-date="${key}" data-level="${level}" aria-label="${longDate(d)}: level ${level}, ${LEVELS[level]}"></span>`);
        }
      }
      // Drop a leading partial-month label that would collide with the next one.
      if (months.length > 1 && months[1].col - months[0].col < 3) months.shift();
      el('months').innerHTML = months
        .map(m => `<span class="month${m.col >= WEEKS - 2 ? ' end' : ''}" style="--col:${m.col}">${m.name}</span>`)
        .join('');
      el('days').innerHTML = cells.join('');
      el('count').textContent = records
        ? `${learningDays} learning ${learningDays === 1 ? 'day' : 'days'} in the last year`
        : 'Learning contributions';
      fit();
    }

    // Size the cells to the embed width; below the minimum, scroll with the latest weeks in view.
    function fit() {
      const viewport = el('viewport');
      const avail = viewport.clientWidth - el('weekdays').offsetWidth;
      const pitch = Math.max(10, Math.min(16, Math.floor(avail / WEEKS)));
      const gap = pitch >= 14 ? 3 : 2;
      root.style.setProperty('--cell', `${pitch - gap}px`);
      root.style.setProperty('--gap', `${gap}px`);
      viewport.classList.toggle('scrolls', viewport.scrollWidth > viewport.clientWidth);
      viewport.scrollLeft = viewport.scrollWidth;
      hideTip();
    }

    const tip = el('tip');
    function showTip(cell) {
      const level = +cell.dataset.level;
      const [y, m, d] = cell.dataset.date.split('-').map(Number);
      tip.firstElementChild.textContent = level ? `Level ${level} · ${LEVELS[level]}` : LEVELS[0];
      tip.lastElementChild.textContent = longDate(new Date(Date.UTC(y, m - 1, d)));
      tip.hidden = false;
      const r = cell.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
      const left = Math.min(Math.max(4, r.left + r.width / 2 - w / 2), innerWidth - w - 4);
      let top = r.top - h - 6;
      if (top < 2) top = Math.min(r.bottom + 6, innerHeight - h - 2);
      tip.style.left = `${left}px`;
      tip.style.top = `${top}px`;
    }
    function hideTip() { tip.hidden = true; }

    const days = el('days');
    days.addEventListener('pointerover', e => e.target.dataset.date ? showTip(e.target) : hideTip());
    // Touch fires pointerleave right after a tap, so only mouse/pen hide on leave; a tap elsewhere hides.
    days.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') hideTip(); });
    document.addEventListener('pointerdown', e => { if (!e.target.dataset.date) hideTip(); });
    el('viewport').addEventListener('scroll', hideTip);
    addEventListener('resize', fit);

    async function refresh() {
      try {
        // Cache-busting query so a reload always sees the latest published commit.
        const response = await fetch(`${DATA_FILE}?t=${Date.now()}`, {cache: 'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!data || data.version !== 1 || !data.records || typeof data.records !== 'object' || Array.isArray(data.records)) {
          throw new Error('Unexpected contributions.json format');
        }
        records = data.records;
        el('status').textContent = '';
      } catch (error) {
        // Keep showing the last good data if a background refresh fails.
        if (!records) {
          el('status').textContent = location.protocol === 'file:'
            ? 'Preview only · serve this folder over HTTP to load contributions.json'
            : 'Learning records unavailable';
        }
      }
      draw();
    }

    refresh();
    // If the embed stays open, pick up new commits periodically and when the tab regains focus.
    setInterval(refresh, 10 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  </script>
</body>
</html>
